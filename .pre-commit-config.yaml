# Pre-commit compliance kit — secrets, sensitive files, dependency licences, SBOM. Free tools only.
# Install: pipx install pre-commit (or pip); pre-commit install; pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks            # MIT — secret detection
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks   # MIT — basic hygiene
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: dependency-licenses
        name: Python dependency licences (list + deny list)
        entry: python3 scripts/dependency_licenses.py --deny "GPL-3.0-only,AGPL-3.0-only" --out compliance/licenses.json
        language: system
        pass_filenames: false
      - id: sbom
        name: Minimal CycloneDX SBOM (Python) from installed metadata
        entry: python3 scripts/sbom_cyclonedx.py --out compliance/sbom.cdx.json
        language: system
        pass_filenames: false
